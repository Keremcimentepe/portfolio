name: Check build

on:
  push:
  pull_request:

jobs:
  public-is-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: python3 build.py
      - name: public/ matches the sources
        run: |
          git status --porcelain public
          test -z "$(git status --porcelain public)"

  deploy:
    name: Deploy to the server
    # Only for pushes to main, and only if public/ matches the sources
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: public-is-up-to-date
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # The server only lets this key run ~/apps/deploy/deploy.sh (authorized_keys command=),
      # which accepts nothing but "gorevtakip" and "portfolio".
      - name: Prepare the SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run deploy/update.sh on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: >
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o ServerAliveInterval=30 "ubuntu@$DEPLOY_HOST" portfolio
