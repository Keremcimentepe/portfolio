[[projects.featured.details]]
term = "API"
text = "EF Core ve PostgreSQL üzerinde ASP.NET Core Minimal API: projeler ve görevler, servis katmanı, FluentValidation ile istek doğrulama, ProblemDetails döndüren merkezi hata yönetimi ve girişte hız sınırlama (rate limiting)."
[[projects.featured.details]]
term = "Güvenlik"
text = "JWT kimlik doğrulama ve PBKDF2 ile parola özetleme. Veriler kullanıcıya özeldir: başka bir kullanıcının kayıtları istendiğinde 404 döner."
[[projects.featured.details]]
term = "Arayüz"
text = "React 19 + TypeScript ile üç sütunlu, sürükle-bırak pano. Güncellemeler iyimser (optimistic) uygulanır; sunucu reddederse geri alınır."
[[projects.featured.details]]
term = "Testler"
text = "WebApplicationFactory ile xUnit entegrasyon testleri, Vitest + React Testing Library bileşen testleri ve Playwright uçtan uca testleri."
[[projects.featured.details]]
term = "Yayın"
text = "GitHub Actions ile CI. Docker Compose ile paketlendi; Oracle Cloud'daki Ubuntu (ARM) sunucuda, otomatik HTTPS sağlayan Caddy'nin arkasında çalışıyor."

