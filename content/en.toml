[projects.featured]
name = "TaskFlow"
kind = "Task board (mini Trello)"
summary = "A task board where each user manages their own projects and tasks on a drag-and-drop board. I built the API, the interface and the tests, and I run it on my own server."
stack = "C#, ASP.NET Core, Entity Framework Core, PostgreSQL, React, TypeScript, Docker"
demo_label = "Live demo"
code_label = "Source code"
code_note = "The repository is called GorevTakip, the project's earlier name."
route_caption = "How a request reaches TaskFlow: the browser connects to Caddy over HTTPS. Caddy sends /api/* requests to the ASP.NET Core API, which stores data in PostgreSQL, and every other request to the React web app."
route_browser = "Browser"
route_api = "ASP.NET Core API"
route_db = "PostgreSQL"
route_web = "React web app"

[[projects.featured.details]]
term = "API"
text = "ASP.NET Core Minimal API with EF Core on PostgreSQL: projects and tasks, a service layer, FluentValidation request validation, global error handling that returns ProblemDetails, and rate limiting on login."
[[projects.featured.details]]
term = "Security"
text = "JWT authentication with PBKDF2 password hashing. Data is isolated per user: requests for another user's records return 404."
[[projects.featured.details]]
term = "Interface"
text = "React 19 + TypeScript board with three columns and drag and drop. Updates are optimistic and roll back if the server rejects them."
[[projects.featured.details]]
term = "Tests"
text = "xUnit integration tests with WebApplicationFactory, Vitest + React Testing Library component tests, and Playwright end-to-end tests."
[[projects.featured.details]]
term = "Delivery"
text = "GitHub Actions CI. Packaged with Docker Compose and deployed to an Oracle Cloud Ubuntu (ARM) server behind Caddy with automatic HTTPS."

